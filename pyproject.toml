[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-dspy"
version = "0.1.0"
description = "DSPy BaseLM backed by the GitHub Copilot Chat API"
requires-python = ">=3.9"
dependencies = [
    "dspy-ai>=2.4.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]

[tool.setuptools]
py-modules = ["copilot_dspy_client"]
